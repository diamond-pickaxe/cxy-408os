<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; font-src data:; frame-src 'self' about:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>宇的大观本地版</title><link rel="stylesheet" href="app.css"></head><body>
<header><div class="brand"><span class="logo-diamonds">◆</span><b>宇的大观本地版</b><span class="local-badge">离线版</span><button id="openDirectory">▤ 知识点</button></div><div class="header-right"><span class="offline-dot">● 完全离线</span><button id="export">备份学习记录</button><button id="import">导入备份</button><input id="importFile" type="file" accept=".json" hidden></div></header>
<div class="layout"><aside><p class="eyebrow">学习空间</p><nav id="nav"><button data-view="overview" class="active">▦　真题总览</button><button data-view="review">↻　薄弱题复习</button><button data-view="collections">☆　我的收藏</button><button data-view="notes">✎　我的笔记</button><button data-view="statistics">◷　学习统计</button></nav><div class="divider"></div><p class="eyebrow">筛选题目</p><label class="hierarchy-control">科目<select id="subject"><option value="">全部四科</option><option>数据结构</option><option>计算机组成原理</option><option>操作系统</option><option>计算机网络</option></select></label><label>整卷刷题<select id="year"><option value="">全部年份</option></select></label><label>题型<select id="type"><option value="">全部题型</option><option value="1">选择题</option><option value="2">非选择题</option></select></label><label class="hierarchy-control">章<select id="chapter"><option value="">全部章节</option></select></label><label class="hierarchy-control">小节<select id="knowledge"><option value="">全部小节</option></select></label><label>掌握状态<select id="mastery"><option value="">全部状态</option><option value="0">未做</option><option value="1">掌握</option><option value="2">不熟</option><option value="3">不会</option></select></label><label>搜索<input id="search" placeholder="题目、知识点或笔记"></label><button id="reset" class="subtle">重置筛选</button><div class="aside-footer">记录保存在这个浏览器里。<br>建议定期导出备份。<br><span id="saveStatus"></span></div></aside>
<main><section id="scopeBanner" class="scope-banner" hidden><div><small>已选择</small><strong id="scopeText"></strong><span id="scopeCount"></span></div><button id="scopeStart">开始专项训练</button><button id="clearScope" aria-label="清除范围">×</button></section><div class="guide-strip">💡 年份刷题 · 科目筛选 · 知识点专项</div><div class="page-heading"><div><p class="eyebrow">一点一点，把 408 学扎实。</p><h1 id="pageTitle">你的真题地图</h1><p class="muted" id="subtitle">每一个色块都是一道题，点开就能继续。</p></div><button class="primary" id="continue">开刷 →</button></div><section id="stats" class="stats"></section><div class="toolbar"><div id="viewHint"></div><div><button id="random">随机一题</button><button id="toggleList">列表视图</button></div></div><section id="content"></section><footer>题目与解析来源：408os.cn · 个人学习备份 · <span id="backupDate"></span><br>离线记录独立保存在本机，不会自动回传原网站。</footer></main></div>
<dialog id="directory"><div class="directory-header"><h2>知识点目录</h2><button id="closeDirectory" aria-label="关闭知识点目录">×</button></div><input id="directorySearch" placeholder="搜索知识点"><div id="directoryTree"></div></dialog><dialog id="study"><div class="study-header"><div><span class="eyebrow" id="questionMeta"></span><h2 id="questionTitle"></h2></div><button id="closeStudy" aria-label="关闭题目">✕</button></div><div class="study-body"><div class="question-tools"><span id="questionTags"></span><button id="favorite">☆ 收藏</button></div><iframe id="questionFrame" title="题目正文" sandbox="allow-same-origin"></iframe><div id="answerChoices" class="answer-choices"></div><div class="answer-actions"><button class="primary" id="checkAnswer">查看答案与解析</button><span id="answerResult" role="status"></span></div><section id="solution" hidden><h3>答案</h3><iframe id="answerFrame" title="正确答案" sandbox="allow-same-origin"></iframe><h3>解析</h3><iframe id="analysisFrame" title="题目解析" sandbox="allow-same-origin"></iframe></section><section class="mark-box"><h3>这道题，现在掌握得怎样？</h3><div id="markButtons"><button data-level="1" class="mark m1">掌握了</button><button data-level="2" class="mark m2">还不熟</button><button data-level="3" class="mark m3">暂时不会</button><button data-level="0" class="mark m0">设为未做</button></div><p id="markStatus" class="muted"></p></section><section><h3>我的笔记</h3><textarea id="note" rows="4" placeholder="记下思路、易错点，或者下次复习的提醒……"></textarea><p class="muted" id="noteStatus">输入后自动保存在本地</p></section><details><summary>本地学习历史</summary><div id="history"></div></details></div><div class="study-footer"><button id="prev">← 上一题</button><span id="position"></span><button id="next" class="primary">下一题 →</button></div></dialog>
<dialog id="collectionsDialog"><h2>加入收藏夹</h2><div id="collectionChecks"></div><div class="create-collection"><input id="newCollectionName" placeholder="新收藏夹名称"><button id="createCollection">新建</button></div><button id="doneCollections" class="primary">完成</button></dialog><div id="toast" role="status"></div>
<script src="data.js"></script><script src="seed.js"></script><script src="vendor.js"></script><script src="app.js"></script></body></html>
